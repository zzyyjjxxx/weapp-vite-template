name: verify

on:
  push:
  pull_request:

jobs:
  static-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm typecheck:app
      - run: pnpm typecheck:e2e
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm verify:generated-runtime
      - run: pnpm analyze:budget

  # Runtime E2E is a separate Windows acceptance job outside hosted CI:
  # it requires a logged-in WeChat DevTools instance with the service port enabled.
