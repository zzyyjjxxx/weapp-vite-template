# Project environment shortcuts for Codex.
version = 1
name = "weapp-vite-template"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"
node scripts/sync-codex-project-skills.mjs
pnpm install --frozen-lockfile --config.confirmModulesPurge=false
'''

[[actions]]
name = "刷新并同步项目 skills"
icon = "tool"
command = "node scripts/sync-codex-project-skills.mjs"

[[actions]]
name = "安装项目依赖"
icon = "tool"
command = "pnpm install --frozen-lockfile --config.confirmModulesPurge=false"
